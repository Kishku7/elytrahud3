plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

version = "${mod_version}+${minecraft_version}-neoforge"
group = 'dev.kishku.elytrahud3'

base {
    archivesName = 'elytrahud3'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Shared single-source-of-truth trees pulled in from the sibling shared_* dirs.
sourceSets.main.java.srcDir "../../shared_common/src/main/java"
sourceSets.main.java.srcDir "../../shared_minecraft/src/main/java"
sourceSets.main.resources.srcDir "../../shared_common/src/main/resources"

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
    }

    mods {
        elytrahud3 {
            sourceSet(sourceSets.main)
        }
    }
}

processResources {
    def expandProps = [mod_version: mod_version, neoforgeRange: project.neoforge_range, mcRange: project.mc_range]
    inputs.properties(expandProps)
    filesMatching('META-INF/neoforge.mods.toml') { expand(expandProps) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
