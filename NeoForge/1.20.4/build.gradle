plugins {
    id 'eclipse'
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

version = "${mod_version}+${minecraft_version}-neoforge"
group = 'dev.kishku.elytrahud3'

base {
    archivesName = 'elytrahud3'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all'
    options.release = 17
}

// NeoForge 20.4 (MC 1.20.2-1.20.4) is pre-rename: legacy META-INF/mods.toml. No mixins -> no
// MixinConfigs manifest attribute needed. ${file.jarVersion} in mods.toml resolves at runtime
// from the jar manifest Implementation-Version.
jar {
    manifest {
        attributes 'Implementation-Version': project.mod_version
    }
}

// Unified-source wiring (minecraft-1.20-26.3): compile the cog-materialized gen/ tree +
// the MC-agnostic cog_sources/common; the cell keeps only its manifest under src/main/resources.
sourceSets.main.java.srcDirs = ['gen/src/main/java', '../../_codegen/cog_sources/common/src/main/java']
sourceSets.main.resources.srcDirs = ['src/main/resources', 'gen/src/main/resources', '../../_codegen/cog_sources/common/src/main/resources']

// gson (an MC library) references ErrorProne annotations that are not on the compile
// classpath; -Xlint:all then warns while reading GsonBuilder.class. Making the annotations
// resolvable (compile-only, ships nothing) is the clean zero-warnings fix.
repositories { mavenCentral() }
dependencies { compileOnly 'com.google.errorprone:error_prone_annotations:2.28.0' }
