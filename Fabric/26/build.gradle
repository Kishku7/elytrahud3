plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}-fabric"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.nucleoid.xyz" }
}

// Shared single-source-of-truth trees pulled in from the sibling shared_* dirs.
sourceSets.main.java.srcDir "../../shared_common/src/main/java"
sourceSets.main.java.srcDir "../../shared_minecraft/src/main/java"
sourceSets.main.resources.srcDir "../../shared_common/src/main/resources"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ModMenu is optional at runtime; needed only to compile the config-screen entrypoint.
    api("com.terraformersmc:modmenu:${project.mod_menu_version}")

    // gson references ErrorProne annotations; resolvable compile-only keeps -Xlint:all silent.
    compileOnly "com.google.errorprone:error_prone_annotations:2.28.0"
}

processResources {
    // 26.x resource pack_format is > 81: the strict datapack codec DEMANDS min/max_format (a plain
    // int FATALs NeoForge dedicated-server load; Fabric is lenient so client tests miss it).
    // Exact-single range form, value injected per 26.X by build-fabric.ps1 via PACK_FORMAT env.
    def packFormat = (System.getenv("PACK_FORMAT") ?: "88")
    inputs.property "version", project.version
    inputs.property "mcDep", project.mc_dep
    inputs.property "packFormat", packFormat

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mcDep": project.mc_dep
    }
    filesMatching("pack.mcmeta") {
        expand "packFormat": packFormat
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.compilerArgs << '-Xlint:all'
    it.options.release = 25
}

java {
    withSourcesJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("../LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
