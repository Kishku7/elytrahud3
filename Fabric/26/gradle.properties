# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# A lingering Gradle daemon INHERITS the build driver's redirected stdout handle and then sits idle
# for hours, so the driver never returns even though the jar is already on disk. It looks like a hung
# build; nothing is building. NeoForge/26 has always had this; Fabric/26 was the cell that hung.
org.gradle.daemon=false

# Fabric Properties -- defaults target the 26.2 build; build-all-fabric.ps1 overrides per target via -P.
minecraft_version=26.2
loader_version=0.19.3

# Mod Properties
mod_version=1.3.0
maven_group=dev.kishku.elytrahud3
archives_base_name=elytrahud3

# Dependencies
fabric_version=0.152.1+26.2
mod_menu_version=18.0.0

# Loader-declared MC range (templated into fabric.mod.json)
mc_dep=>=26.1
